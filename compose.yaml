name: research-agent

services:
  backend:
    build: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      RESEARCH_WORKSPACE_ROOT: /app/data/workspaces
      RESEARCH_AI_MODE: ${RESEARCH_AI_MODE:-demo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    volumes:
      - research-data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  research-data:
